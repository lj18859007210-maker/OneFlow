server:
  address: ${HOST:0.0.0.0}
  port: ${PORT:8877}

spring:
  application:
    name: oneflow-api
  datasource:
    url: ${ONEFLOW_DATASOURCE_URL:jdbc:oracle:thin:@//${ORACLE_HOST:localhost}:${ORACLE_PORT:1521}/${ORACLE_SERVICE_NAME:ORCL}}
    username: ${ORACLE_USER:system}
    password: ${ORACLE_PASSWORD:oracle}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      minimum-idle: ${ORACLE_POOL_MIN:1}
      maximum-pool-size: ${ORACLE_POOL_MAX:3}

oneflow:
  jwt:
    secret: ${JWT_SECRET:change-this-secret}
    expires-in-seconds: ${JWT_EXPIRES_IN_SECONDS:604800}
  captcha:
    enabled: ${CAPTCHA_ENABLED:true}
    expires-in-seconds: ${CAPTCHA_EXPIRES_IN_SECONDS:300}
  security:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
