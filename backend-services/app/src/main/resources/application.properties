# ============================================================
# OneFlow 需求管理平台 — 应用配置
# ============================================================
server.address=${HOST:0.0.0.0}
server.port=${PORT:8877}
spring.application.name=oneflow-app

# ============================================================
# 数据库配置（Oracle）
# ============================================================
spring.datasource.url=${ONEFLOW_DATASOURCE_URL:jdbc:oracle:thin:@//${ORACLE_HOST:localhost}:${ORACLE_PORT:1521}/${ORACLE_SERVICE_NAME:ORCL}}
spring.datasource.username=${ORACLE_USER:system}
spring.datasource.password=${ORACLE_PASSWORD:oracle}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.minimum-idle=${ORACLE_POOL_MIN:1}
spring.datasource.hikari.maximum-pool-size=${ORACLE_POOL_MAX:3}

# ============================================================
# OneFlow 业务配置
# ============================================================
oneflow.jwt.secret=${JWT_SECRET:change-this-secret}
oneflow.jwt.expires-in-seconds=${JWT_EXPIRES_IN_SECONDS:604800}
oneflow.captcha.enabled=${CAPTCHA_ENABLED:true}
oneflow.captcha.expires-in-seconds=${CAPTCHA_EXPIRES_IN_SECONDS:300}
oneflow.security.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# ============================================================
# 日志
# ============================================================
logging.level.root=${LOG_LEVEL:INFO}
