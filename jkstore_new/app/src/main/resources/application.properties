# ============================================================
# OneFlow 需求管理平台 — 应用配置
# ============================================================
server.address=${HOST:0.0.0.0}
server.port=${PORT:8877}
spring.application.name=oneflow-app

# ============================================================
# 数据库配置（达梦 DM8）
# ============================================================
spring.datasource.url=jdbc:dm://${DM_HOST:10.44.131.243}:${DM_PORT:5236}/${DM_SCHEMA:ONEFLOW}
spring.datasource.username=${DM_USER:ONEFLOW}
spring.datasource.password=${DM_PASSWORD:Oracle@JKS#2026!}
spring.datasource.driver-class-name=dm.jdbc.driver.DmDriver
spring.datasource.hikari.minimum-idle=${DM_POOL_MIN:1}
spring.datasource.hikari.maximum-pool-size=${DM_POOL_MAX:3}

# ============================================================
# OneFlow 业务配置
# ============================================================
oneflow.jwt.secret=${JWT_SECRET:change-this-secret}
oneflow.jwt.expires-in-seconds=${JWT_EXPIRES_IN_SECONDS:604800}
oneflow.captcha.enabled=${CAPTCHA_ENABLED:true}
oneflow.captcha.expires-in-seconds=${CAPTCHA_EXPIRES_IN_SECONDS:300}
oneflow.security.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# ============================================================
# 日志
# ============================================================
logging.level.root=${LOG_LEVEL:INFO}
